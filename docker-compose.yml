services:
  version-checker:
    build: .
    image: ai-release-tracker:latest
    container_name: ai-release-tracker
    environment:
      - CLAUDE_CODE_BOT_TOKEN=${CLAUDE_CODE_BOT_TOKEN:-}
      - CLAUDE_CODE_CHAT_ID=${CLAUDE_CODE_CHAT_ID:-}
      - CODEX_BOT_TOKEN=${CODEX_BOT_TOKEN:-}
      - CODEX_CHAT_ID=${CODEX_CHAT_ID:-}
      - OPENCLAW_BOT_TOKEN=${OPENCLAW_BOT_TOKEN:-}
      - OPENCLAW_CHAT_ID=${OPENCLAW_CHAT_ID:-}
      - HERMES_BOT_TOKEN=${HERMES_BOT_TOKEN:-}
      - HERMES_CHAT_ID=${HERMES_CHAT_ID:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_PROVIDER_ONLY=${LLM_PROVIDER_ONLY:-}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-}
      - GH_TOKEN=${GH_TOKEN:-}
      - TELEGRAPH_ACCESS_TOKEN=${TELEGRAPH_ACCESS_TOKEN:-}
    volumes:
      - ./output:/app/output
    restart: "no"
